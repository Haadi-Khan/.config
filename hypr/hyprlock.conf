# hyprlock config
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = RecMonoLinear Nerd Font

general {
    hide_cursor = true
}

# Fingerprint via fprintd, runs alongside password entry
auth {
    fingerprint {
        enabled = true
        ready_message = Touch sensor or type password
        present_message = Scanning...
        retry_delay = 250 # ms
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/background.jpg
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    # Match window border gradient
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(33ccffee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(171, 178, 191)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = $FPRINTPROMPT
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    font_size = 90
    font_family = $font
    color = rgb(171, 178, 191)

    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgb(171, 178, 191)

    position = 0, 100
    halign = center
    valign = center
}
