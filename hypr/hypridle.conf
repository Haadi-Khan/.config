# hypridle config
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (incl. lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; /home/haadi/.local/bin/battery-screen-log on # turn on screen w/o key press after resume
}

# Dim screen
listener {
    timeout = 450                                # 7.5min
    on-timeout = brightnessctl -s set 10         # avoid 0 in case of OLED
    on-resume = brightnessctl -r
}

# Keyboard backlight off
listener {
    timeout = 450                                                    # 7.5min
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = brightnessctl -rd chromeos::kbd_backlight
}

# Lock
listener {
    timeout = 600                                # 10min
    on-timeout = loginctl lock-session
}

# Screen off
listener {
    timeout = 630                                                 # 10.5min
    on-timeout = /home/haadi/.local/bin/battery-screen-log off; hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; /home/haadi/.local/bin/battery-screen-log on
}

# Suspend (only on battery; stays awake when plugged in)
listener {
    timeout = 1800                               # 30min
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && systemctl suspend
}
