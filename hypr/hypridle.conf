# hypridle config
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (incl. lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn on screen w/o key press after resume
}

# Dim screen
listener {
    timeout = 150                                # 2.5min
    on-timeout = brightnessctl -s set 10         # avoid 0 in case of OLED
    on-resume = brightnessctl -r
}

# Keyboard backlight off
listener {
    timeout = 150                                                    # 2.5min
    on-timeout = brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = brightnessctl -rd chromeos::kbd_backlight
}

# Lock
listener {
    timeout = 300                                # 5min
    on-timeout = loginctl lock-session
}

# Screen off
listener {
    timeout = 330                                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend
listener {
    timeout = 1800                               # 30min
    on-timeout = systemctl suspend
}
