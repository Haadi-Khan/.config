monitor=,preferred,auto,auto

exec-once = waybar & hyprpaper & emacs --daemon & sudo ./titdb -d /dev/input/event2 -m f

# Set programs that you use
$terminal = ghostty
$fileManager = files
$browser = zen-browser
$menu = fuzzel -b 282c34ff -t abb2bfff -s 4b5263ff -S abb2bfff -C 61afefff -m 61afefff -M 61afefff -w 20 --show-actions -f "Recursive Linear:weight=regular:size=16"
$sshot = grimshot copy area

exec = gsettings set org.gnome.desktop.interface gtk-theme "YOUR_DARK_GTK3_THEME"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# Some default env vars.
env = XCURSOR_SIZE,24
# env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    mouse_refocus = false

    sensitivity = 0.0 # [-1.0,1.0] Keeping this negative to reduce amount of
                       # accidental movement until libinput stops sucking lol

    touchpad {
    disable_while_typing = true
    natural_scroll = false
    scroll_factor = 0.25
    tap-and-drag = false
    tap-to-click = false
    }
}
gestures {
    workspace_swipe = true
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true
}

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = true
}


# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

$mod = SUPER
$smod = SUPER_SHIFT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, return, exec, $terminal
bind = $mod, m, exec, $browser
bind = $mod, q, killactive, 
bind = $smod, 0, exit, 
binde = $mod, comma, exec, $fileManager
bind = $mod, space, togglefloating, 
bind = $mod, apostrophe, exec, $menu
bind = CTRL_SHIFT, s, exec, $sshot

# Move focus with mod + arrow keys
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, d

bind = $smod, h, movewindow, l
bind = $smod, l, movewindow, r
bind = $smod, k, movewindow, u
bind = $smod, j, movewindow, d 

# Switch workspaces with mod + [0-9]
bind = $mod, s, workspace, 1
bind = $mod, d, workspace, 2
bind = $mod, f, workspace, 3
bind = $mod, g, workspace, 4
bind = $mod, w, workspace, 5
bind = $mod, e, workspace, 6
bind = $mod, r, workspace, 7
bind = $mod, t, workspace, 8
bind = $mod, x, workspace, 9
bind = $mod, c, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $smod, s, movetoworkspace, 1
bind = $smod, d, movetoworkspace, 2
bind = $smod, f, movetoworkspace, 3
bind = $smod, g, movetoworkspace, 4
bind = $smod, w, movetoworkspace, 5
bind = $smod, e, movetoworkspace, 6
bind = $smod, r, movetoworkspace, 7
bind = $smod, t, movetoworkspace, 8
bind = $smod, x, movetoworkspace, 9
bind = $smod, c, movetoworkspace, 10

bind = $mod, o, submap, resize

# will start a submap called "resize"
submap = resize

# sets repeatable binds for resizing the active window
binde = , l, resizeactive, 10 0
binde = , h, resizeactive, -10 0
binde = , k, resizeactive, 0 -10
binde = , j, resizeactive, 0 10

# use reset to go back to the global submap
bind = , escape, submap, reset 

# will reset the submap, which will return to the global submap
submap = reset

bind = $mod, p, fullscreen

binde = $mod, period, exec, emacsclient -c -a ""

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
